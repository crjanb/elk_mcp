services:
  backend:
    build: ./backend
    container_name: dummy-backend
    environment:
      - LOG_PATH=/var/log/app/app_ecs.log
      - SERVICE_NAME=dummy-backend
    volumes:
      - ./logs:/var/log/app
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      - node.name=es01
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=changeme
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: kb01
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=changeme
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped


  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.2
    container_name: fb01
    user: root
    entrypoint: >
      sh -c "
        chmod 600 /usr/share/filebeat/filebeat.yml &&
        filebeat -e
      "
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - ./logs:/var/log/app:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped

  
  elastic_mcp:
    image: docker.elastic.co/mcp/elasticsearch:0.4.0
    environment:
      - ES_URL=http://elasticsearch:9200
      - ES_API_KEY=MDd2SlJwd0JNdk1HRHZJdXE3M0M6VFZ1ZkhQdFNSNnlWdnpOXzRXeXNfZw==   #your api key here
    ports:
      - "8080:8080"
    depends_on:
      - elasticsearch
    restart: unless-stopped
    command: ["http"]




volumes:
  esdata:
