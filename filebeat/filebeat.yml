filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/app/app_ecs.log
    json.keys_under_root: true
    json.add_error_key: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  username: "elastic"
  password: "changeme"

# Custom index name
output.elasticsearch.index: "logs-dummy-backend-%{+yyyy.MM.dd}"

# REQUIRED when you change output index name:
setup.template.enabled: true
setup.template.name: "logs-dummy-backend"
setup.template.pattern: "logs-dummy-backend-*"

# Keep ILM off for now
setup.ilm.enabled: false

logging.level: info
